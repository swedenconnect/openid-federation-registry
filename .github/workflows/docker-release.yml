name: docker-release.yml
on:
  workflow_call:
    inputs:
      service-path:
        required: true
        type: string
jobs:
  docker-ghcr-publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: npm-
      - name: Set Maven version from tag name
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "TAG:$TAG"
          NEW_VERSION=${TAG#v}
          echo "New version is $NEW_VERSION"
          ./internal/set-version.sh "$NEW_VERSION"

      - name: Publish image
        run: |
          DOCKER_REPO=ghcr.io mvn clean install jib:build -Ddocker.repository=ghcr.io --no-transfer-progress

        working-directory: ${{inputs.service-path}}
        env:
          GITHUB_TOKEN: ${{ secrets.SC_ACTION_SECRET }}
